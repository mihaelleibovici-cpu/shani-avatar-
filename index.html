<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>האווטאר של שני</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .avatar-box {
            width: 280px;
            height: 280px;
            border-radius: 20px;
            border: 3px solid #38bdf8;
            overflow: hidden;
            background-color: #1e293b;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.1s ease;
        }
        .speaking {
            animation: pulseLip 0.25s infinite alternate;
        }
        @keyframes pulseLip {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); }
        }
        .status-text { font-size: 1.1rem; color: #94a3b8; text-align: center; min-height: 30px; }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
            user-select: none;
        }
        .btn:active { background-color: #0369a1; transform: scale(0.98); }
        .btn.listening { background-color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar-box">
            <img id="avatarImg" src="20261107_153609.heic" alt="אבא">
        </div>

        <div id="status" class="status-text">לחצי על הכפתור כדי לדבר עם אבא</div>

        <button id="talkBtn" class="btn" onclick="toggleListening()">לחצי כדי לדבר</button>
    </div>

    <!-- נגני הקול האמיתיים שלך -->
    <audio id="audioGreeting" src="Greeting.m4a" preload="auto"></audio>
    <audio id="audioComfort" src="Comfort.m4a" preload="auto"></audio>
    <audio id="audioLove" src="Love.m4a" preload="auto"></audio>

    <script>
        const avatarImg = document.getElementById('avatarImg');
        const statusText = document.getElementById('status');
        const talkBtn = document.getElementById('talkBtn');

        const audioGreeting = document.getElementById('audioGreeting');
        const audioComfort = document.getElementById('audioComfort');
        const audioLove = document.getElementById('audioLove');

        let recognition;
        let isListening = false;
        let isFirstTime = true;

        if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'he-IL';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                talkBtn.innerText = "אבא מקשיב... לחצי לסיום";
                talkBtn.classList.add('listening');
                statusText.innerText = "דברי עכשיו, אני מקשיב...";
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                statusText.innerText = 'שני: "' + text + '"';
                stopListeningState();
                handleShaniInput(text);
            };

            recognition.onerror = () => {
                stopListeningState();
                statusText.innerText = "לא הצלחתי לשמוע, לחצי שוב כדי לדבר";
            };

            recognition.onend = () => {
                stopListeningState();
            };
        } else {
            statusText.innerText = "הדפדפן אינו תומך בזיהוי קולי";
        }

        function toggleListening() {
            if (isFirstTime) {
                isFirstTime = false;
                playMyAudio(audioGreeting);
                return;
            }

            if (!isListening) {
                try { recognition.start(); } catch(e){}
            } else {
                try { recognition.stop(); } catch(e){}
            }
        }

        function stopListeningState() {
            isListening = false;
            talkBtn.innerText = "לחצי כדי לדבר";
            talkBtn.classList.remove('listening');
        }

        function handleShaniInput(userText) {
            const lower = userText.toLowerCase();

            if (lower.includes("עצב") || lower.includes("עצובה") || lower.includes("רע") || lower.includes("קשה") || lower.includes("בוכה")) {
                playMyAudio(audioComfort);
            } else {
                playMyAudio(audioLove);
            }
        }

        function playMyAudio(audioElement) {
            avatarImg.classList.add('speaking');
            statusText.innerText = "אבא מדבר...";

            audioElement.play().catch(e => console.log("Audio play error:", e));

            audioElement.onended = () => {
                avatarImg.classList.remove('speaking');
                statusText.innerText = "לחצי על הכפתור כדי להמשיך לדבר";
            };
        }
    </script>

</body>
</html>
