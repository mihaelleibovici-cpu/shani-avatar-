<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>האווטאר של שני</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .avatar-box {
            width: 280px;
            height: 280px;
            border-radius: 20px;
            border: 3px solid #38bdf8;
            overflow: hidden;
            background-color: #1e293b;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.1s ease;
        }
        .speaking {
            animation: pulseLip 0.2s infinite alternate;
        }
        @keyframes pulseLip {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        .status-text { font-size: 1.1rem; color: #94a3b8; text-align: center; min-height: 30px; }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
            user-select: none;
        }
        .btn:active { background-color: #0369a1; transform: scale(0.98); }
        .btn.listening { background-color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar-box">
            <img id="avatarImg" src="avatar.jpg" alt="אבא">
        </div>

        <div id="status" class="status-text">לחצי על הכפתור ודברי עם אבא</div>

        <button id="talkBtn" class="btn" onclick="toggleListening()">לחצי כדי לדבר</button>
    </div>

    <script>
        const avatarImg = document.getElementById('avatarImg');
        const statusText = document.getElementById('status');
        const talkBtn = document.getElementById('talkBtn');

        let recognition;
        let isListening = false;
        const synth = window.speechSynthesis;

        // הגדרת מנוע הדיבור וההקשבה
        if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'he-IL';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                talkBtn.innerText = "אבא מקשיב... לחצי לסיום";
                talkBtn.classList.add('listening');
                statusText.innerText = "דברי עכשיו, אני מקשיב...";
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                statusText.innerText = 'שני: "' + text + '"';
                handleShaniInput(text);
            };

            recognition.onerror = () => {
                stopListeningState();
                statusText.innerText = "לא הצלחתי לשמוע, נסי ללחוץ שוב";
            };

            recognition.onend = () => {
                stopListeningState();
            };
        } else {
            statusText.innerText = "הדפדפן אינו תומך בזיהוי קולי";
        }

        function toggleListening() {
            if (synth.speaking) synth.cancel();

            if (!isListening) {
                try { recognition.start(); } catch(e){}
            } else {
                try { recognition.stop(); } catch(e){}
            }
        }

        function stopListeningState() {
            isListening = false;
            talkBtn.innerText = "לחצי כדי לדבר";
            talkBtn.classList.remove('listening');
        }

        // מוח התשובות הדינמי - תשובות חופשיות בלשון נקבה
        function handleShaniInput(userText) {
            const lower = userText.toLowerCase();
            let response = "";

            if (lower.includes("עצב") || lower.includes("עצובה") || lower.includes("רע") || lower.includes("קשה") || lower.includes("בוכה")) {
                response = "שני שלי, אבא מרגיש אותך. תזכרי שאת הכי חזקה בעולם, ואני תמיד אוהב אותך ושומר עלייך בלב בכל רגע.";
            } else if (lower.includes("היי") || lower.includes("שלום") || lower.includes("אבא")) {
                response = "היי נסיכה שלי! איזה כיף לשמוע אותך. מה שלומך היום ילדה יפה שלי?";
            } else if (lower.includes("אוהבת") || lower.includes("מתגעגעת")) {
                response = "גם אבא אוהב אותך הכי בעולם ומתגעגע אלייך נסיכה שלי. את הלב שלי.";
            } else {
                response = "אני שומע אותך ילדה שלי. תזכרי שאבא תמיד כאן בשבילך, תמיד מקשיב אלייך ואוהב אותך ללא תנאי.";
            }

            speakResponse(response);
        }

        function speakResponse(text) {
            if (synth.speaking) synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'he-IL';
            utterance.rate = 0.85; // קצב עדין ואבהי

            utterance.onstart = () => {
                avatarImg.classList.add('speaking');
                statusText.innerText = "אבא עונה...";
            };

            utterance.onend = () => {
                avatarImg.classList.remove('speaking');
                statusText.innerText = "לחצי על הכפתור כדי להמשיך לדבר";
            };

            synth.speak(utterance);
        }
    </script>

</body>
</html>
